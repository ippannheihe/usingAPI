<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>JSON API テスト</title>
    <style>
        body {
            font-family: sans-serif;
        }

        textarea {
            width: 600px;
            height: 200px;
        }

        pre {
            background: #f5f5f5;
            padding: 8px;
        }
    </style>
</head>
<body>
<h1>JSONテキストでAPIとやり取り</h1>

<!-- APIのURL -->
<label>
    API URL:
    <input id="apiUrl" type="text" size="60"
           value="https://api.networkprint.jp/nwpsapi/v2/files/">
</label>
<br><br>

<!-- JSONテキスト入力欄 -->
<label>Tokenの入力
    <br>
    <input id="tokenKey" size="60"
           value="cf61972d-2882-4fef-87af-15511fce5d75">
    <br><br>
</label>
<label>
    fileId入力:
    <br>
    <input id="fileId" size="60" value="1605746">
</label>
<br><br>
<label>
    レスポンスのpreview_urlがセキュリティ強化モードかを指定します。<li>
    <select id="secure">
        <option value="">--</option>
        <option value="true">true</option>
        <option value="false">false</option>
    </select></li>
</label>
<br><br>
<button id="sendBtn">送信</button>

<h2>レスポンス</h2>
<pre id="responseView">(まだレスポンスはありません)</pre>
<img id="previewImage">

<script>
    const apiUrlInput = document.getElementById('apiUrl');
    const tokenKey = document.getElementById('tokenKey');
    const fileNum = document.getElementById('fileId');
    const secure = document.getElementById('secure');
    const sendBtn = document.getElementById('sendBtn');
    const responseView = document.getElementById('responseView');
    let previewImage = document.getElementById('previewImage');

    sendBtn.addEventListener('click', async () => {
        const url = apiUrlInput.value.trim();
        const token = tokenKey.value.trim();
        const fileId = fileNum.value.trim();
        const secureMode = secure.value.trim();
        let pre = "";

        if (!url) {
            alert('API URL を入力してください');
            return;
        }
        if (!token) {
            alert('NWPSTokenを入力してください');
            return;
        }
        if (!fileId) {
            alert('fileIdを入力してください');
            return;
        }
        if (secureMode === "") {
            pre = '?secure_mode=' + secureMode;

        }
            const previewUrl = url + fileId + '/previews'+pre;
        try {

            // fetchでGET送信
            const res = await fetch(previewUrl, {
                method: 'GET',
                headers: {
                    'X-NWPSToken': token,
                    'Accept': 'application/json'
                }
            });

            if (!res.ok) {
                const errText = await res.text();
                responseView.textContent =
                    `HTTPエラー: ${res.status}\n\n` + errText;
                return;
            }

            const resJson = await res.json();
            const ImageUrl = await resJson.preview_url;
            responseView.textContent = JSON.stringify(resJson, null, 2);
            document.getElementById('previewImage').src = ImageUrl;
        } catch (e) {
            responseView.textContent = 'エラー: ' + e.message;
        }
    });
</script>
</body>
</html>
