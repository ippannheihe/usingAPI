<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ファイルの情報取得</title>
    <link rel="stylesheet" href="../src/css/style.css">
</head>
<body>
<h1>ファイルの一覧情報を取得する</h1>
<br>

<label>
    取得したいファイルリストの最大件数の指定
    <br>
    <input id="limit" value="0">
</label>
<br><br>
<label>
    レスポンスのthumbnail_urlsがセキュリティ強化モードかを指定します。<li>
    <select id="secure">
        <option value="--">--</option>
        <option value="true">true</option>
        <option value="false">false</option>
    </select></li>
</label>
<br><br>
<button id="sendBtn">送信</button>

<h2>レスポンス</h2>
<pre id="responseView">(まだレスポンスはありません)</pre>
<pre id="requestURL"></pre>
<script src="../src/js/files.js"></script>
</body>
</html>
