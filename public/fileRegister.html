<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>画像の登録</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <script type="module" src="../src/js/fileRegister.js"></script>
</head>
<body>
<h1>ファイルの画像を登録できる</h1>
<div><a href="https://api.networkprint.jp/sharp_netprint/ja/information.aspx" target="_blank" rel="noopener noreferrer">お知らせ</a></div>
<nav>
    <ul>
        <li><a href="fileRegister.html">登録</a></li>
        <li><a href="files.html">ファイル一覧</a></li>
        <li><a href="preview.html">プレビュー</a></li>
        <li><a href="home.html">いろいろ</a></li>
    </ul>
</nav>
<br>
<div id="error" class="error">
    <div class="error-content">
        <span id="closeModalBtn" class="close">&times;</span>
        <p>ファイルアップロードに失敗</p>
        <p id="responseView"></p>
    </div>
</div>
    <label>
        画像ファイル選択
        <li>
            <input type="file" id="imageId"></li>
    </label>
    <br><br>
    <label>
        フォルダ選択(Chrome/Edge/Operaなどに限る)
        <li>
            <input type="file" webkitdirectory id="imageFolder"></li>
    </label>
    <br><br>

    <button id="sendBtn">送信</button>
<br>
<br>
    <div id="previewImage"></div>



</body>
</html>
