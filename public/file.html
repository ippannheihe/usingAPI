<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>JSON API テスト</title>
    <style>
        body {
            font-family: sans-serif;
        }

        textarea {
            width: 600px;
            height: 200px;
        }

        pre {
            background: #f5f5f5;
            padding: 8px;
        }
    </style>
</head>
<body>
<h1>JSONテキストでAPIとやり取り</h1>

<!-- APIのURL -->
<label>
    API URL:
    <input id="apiUrl" type="text" size="60"
           value="https://api.networkprint.jp/nwpsapi/v2/files/image">
</label>
<br><br>

<!-- 画像ファイル入力欄 -->

<label>tokenの入力
    <br>
    <input id="tokenKey" size="60"
           value="cf61972d-2882-4fef-87af-15511fce5d75"></input>
    <br><br>
</label>
<label>
    画像ファイル選択
    <li>
        <input type="file" id="imageId"></li>
</label>
<br><br>

<button id="sendBtn">送信</button>

<h2>レスポンス</h2>
<pre id="responseView">(まだレスポンスはありません)</pre>
<script src="../src/js/fileRegister.js"></script>
</body>
</html>
