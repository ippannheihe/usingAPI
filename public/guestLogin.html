<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ゲストログイン(ランダムプリント有効化予定)</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <script type="module" src="../src/js/guestLogin.js" defer></script>

</head>
<body>
<header><a href="https://networkprint.ne.jp/sharp_netprint/ja/top.aspx"><img src="../public/asset/img/new_netprint_logo-1mA3LuwU.png"> </a> </header>
<div><a href="https://api.networkprint.jp/sharp_netprint/ja/information.aspx" target="_blank" rel="noopener noreferrer">お知らせ</a></div>
<img src="../public/asset/img/icon_conv_t.png" alt="">
<nav>
    <ul>
        <li><img src="../public/asset/img/logo_family-CInHIkFU.png" alt=""></li>
        <li><img src="../public/asset/img/download.png" alt=""></li>
        <li><img src="../public/asset/img/logo_ministop-Bl-2nnTP.png" alt=""></li>
        <li><img src="../public/asset/img/logo_lawson-BrpsOGFo.png" alt=""></li>
    </ul>
</nav>
<h1>コンビニで簡単ランダムプリント</h1>
<br>
<p>ファイルを登録し、コンビニのマルチコピー機でプリントするためのユーザー番号を発行します。
    会員登録は不要です。
<p>
<label>APPkeyの入力
    <br>
    <input id="tokenKey"
           value="28ce617e-af8b-4110-9eb7-c4ea165c43fe">
    <br>
</label>
<label>
    JSON入力:
    <br>
    <textarea id="jsonText">
{
  "random_print_enable": "false",
  "client": "Android",
  "os": "15",
  "brand": "SHARP",
  "model": "SH51E",
  "width": 1080,
  "height": 2340
}
    </textarea>
</label>
<br><br>
<br>

<div id="manual">
    ご利用いただくにあたり、
    <a href="https://networkprint.ne.jp/Lite/terms.html"  target="_blank" rel="noopener noreferrer">「ネットワークプリントサービス利用規約」</a>
    および
    <a href="https://smj.jp.sharp/bs/contact/networkprint/"  target="_blank" rel="noopener noreferrer">「ネットワークプリント個人情報取り扱いについて」</a>
    をご確認いただき、同意してください。
    <li>ファイルを削除・表示する場合は、ファイルを登録したブラウザーから操作してください。
    <li>別のブラウザー（シークレットモードなども含む）で登録したファイルは削除・表示できません。
</div>

<label>
    <input id="isAgree" type="radio"> 同意する </label>
<br>
<button id="sendBtn" disabled>ゲストログイン</button>

<div id="error" class="error">
    <div class="error-content">
        <span id="errorAleart" class="close">&times;</span>
        <p>ユーザー番号</p>
        <p id="alertMessage"></p>
        <p id="responseView"></p>
    </div>
</div>

</body>
</html>
