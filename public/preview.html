<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ファイルのプレビュー</title>
    <link rel="stylesheet" href="../src/css/style.css">
</head>
<body>
<h1>ファイルのプレビューを見る(改装予定)</h1>
<br>
<!-- JSONテキスト入力欄 -->
<label>Tokenの入力
    <br>
    <input id="tokenKey"
           value="33434eb3-e55e-4a79-b32f-174e5b8f348e">
    <br><br>
</label>
<label>
    fileId入力:
    <br>
    <input id="fileId" size="60" value="1605785">
</label>
<br><br>
<label>
    レスポンスのpreview_urlがセキュリティ強化モードかを指定します。<li>
    <select id="secure">
        <option value="--">--</option>
        <option value="true">true</option>
        <option value="false">false</option>
    </select></li>
</label>
<br><br>
<button id="sendBtn">送信</button>

<h2>レスポンス</h2>
<pre id="responseView">(まだレスポンスはありません)</pre>

<img id="previewImage" alt="">
<pre id="requestURL"></pre>
<script src="../src/js/filePreview.js"></script>
</body>
</html>
