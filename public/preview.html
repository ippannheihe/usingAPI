<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>JSON API テスト</title>
    <style>
        body {
            font-family: sans-serif;
        }

        textarea {
            width: 600px;
            height: 200px;
        }

        pre {
            background: #f5f5f5;
            padding: 8px;
        }
    </style>
</head>
<body>
<h1>JSONテキストでAPIとやり取り</h1>

<!-- APIのURL -->
<label>
    API URL:
    <input id="apiUrl" type="text" size="60"
           value="https://api.networkprint.jp/nwpsapi/v2/files/">
</label>
<br><br>

<!-- JSONテキスト入力欄 -->
<label>Tokenの入力
    <br>
    <input id="tokenKey" size="60"
           value="cf61972d-2882-4fef-87af-15511fce5d75">
    <br><br>
</label>
<label>
    fileId入力:
    <br>
    <input id="fileId" size="60" value="1605746">
</label>
<br><br>
<label>
    レスポンスのpreview_urlがセキュリティ強化モードかを指定します。<li>
    <select id="secure">
        <option value="">--</option>
        <option value="true">true</option>
        <option value="false">false</option>
    </select></li>
</label>
<br><br>
<button id="sendBtn">送信</button>

<h2>レスポンス</h2>
<pre id="responseView">(まだレスポンスはありません)</pre>

<img id="previewImage">
<pre id="requestURL"></pre>
<script src="../src/js/filePreview.js"></script>
</body>
</html>
