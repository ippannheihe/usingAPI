<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>JSON API テスト</title>
  <style>
    body { font-family: sans-serif; }
    textarea { width: 600px; height: 200px; }
    pre { background: #f5f5f5; padding: 8px; }
  </style>
</head>
<body>
  <h1>JSONテキストでAPIとやり取り</h1>

  <!-- APIのURL -->
  <label>
    API URL:
    <input id="apiUrl" type="text" size="60"
           value="https://api.networkprint.jp/nwpsapi/v2/files/image">
  </label>
  <br><br>

  <!-- 画像ファイル入力欄 -->

  <label>tokenの入力
    <br>
    <input id="tokenKey" size="60"
    value="7ceba45c-b589-45b6-b121-ff22627139bc"></input>
    <br><br>

  <label>
    画像ファイル選択<li>
    <input id="filename" type="file" multiple></li>
  </label>
  <br><br>

  <button id="sendBtn">送信</button>

  <h2>レスポンス</h2>
  <pre id="responseView">(まだレスポンスはありません)</pre>

  <script>
    const apiUrlInput = document.getElementById('apiUrl');
    const tokenKey    = document.getElementById('tokenKey');
    const filena        = document.getElementById('filename');
    const sendBtn     = document.getElementById('sendBtn');
    const responseView = document.getElementById('responseView');
    sendBtn.addEventListener('click', async () => {
      const url = apiUrlInput.value.trim();
      const token = tokenKey.value.trim();
      const file = filena.files[0];

      if (!url) {
        alert('API URL を入力してください');
        return;
      }
      if (!file) {
        alert('送信するファイルを入力してください');
        return;
      }
      try {
        // JSONとしてパース（エラー確認）
        const text = await file.text();
        const jsonData = JSON.parse(text);

        // fetchでPOST送信
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'multipart/form-data',
            'X-NWPSToken':token,
            'Accept': 'application/json'
          },
          body: JSON.stringify(jsonData)

        });

        if (!res.ok) {
          const errText = await res.file();
          responseView.textContent =
            `HTTPエラー: ${res.status}\n\n` + errText;
          return;
        }

        const resJson = await res.json();
        responseView.textContent = JSON.stringify(resJson, null, 2);

      } catch (e) {
        responseView.textContent = 'エラー: ' + e.message;
      }
    });
  </script>
</body>
</html>
