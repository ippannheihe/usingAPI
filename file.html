<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>JSON API テスト</title>
    <style>
        body {
            font-family: sans-serif;
        }

        textarea {
            width: 600px;
            height: 200px;
        }

        pre {
            background: #f5f5f5;
            padding: 8px;
        }
    </style>
</head>
<body>
<h1>JSONテキストでAPIとやり取り</h1>

<!-- APIのURL -->
<label>
    API URL:
    <input id="apiUrl" type="text" size="60"
           value="https://api.networkprint.jp/nwpsapi/v2/files/image">
</label>
<br><br>

<!-- 画像ファイル入力欄 -->

<label>tokenの入力
    <br>
    <input id="tokenKey" size="60"
           value="9505026c-da6f-4a56-bc90-4216d6ca69c4"></input>
    <br><br>
</label>
<label>
    画像ファイル選択
    <li>
        <input type="file" id="imageId"></li>
</label>
<br><br>

<button id="sendBtn">送信</button>

<h2>レスポンス</h2>
<pre id="responseView">(まだレスポンスはありません)</pre>
<script>
    const apiUrlInput = document.getElementById('apiUrl');
    const tokenKey = document.getElementById('tokenKey');
    const iFiles = document.getElementById('imageId');
    const sendBtn = document.getElementById('sendBtn');
    const responseView = document.getElementById('responseView');

    sendBtn.addEventListener('click', async () => {
        const url = apiUrlInput.value.trim();
        const token = tokenKey.value.trim();
        const imageFile = iFiles.files[0];

        if (!url) {
            alert('API URL を入力してください');
            return;
        }
        if (!iFiles.files.length) {
            alert('画像ファイルを選択してください');
            return;
        }
        // multipart/form-data の中身を作る
        const formData = new FormData();
        formData.append('file', imageFile);

        try {

            // fetchでPOST送信
            const res = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'X-NWPSToken': token,
                        'Accept': 'application/json',
                        'Content-Type': 'multipart/form-data'
                    },
                    body: formData
                }
            );

            if (!res.ok) {
                const errText = await res.text();
                responseView.textContent =
                    `HTTPエラー: ${res.status}\n\n` + errText;
                return;
            }

            const resJson = await res.json();
            responseView.textContent = JSON.stringify(resJson, null, 2);

        } catch (e) {
            responseView.textContent = 'エラー: ' + e.message;
        }
    });
</script>
</body>
</html>
